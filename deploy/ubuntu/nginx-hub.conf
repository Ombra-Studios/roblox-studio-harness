# /etc/nginx/sites-available/studio-harness-hub — HTTPS în fața hub-ului. Înlocuiește domeniul.
# Certificat: sudo apt install certbot python3-certbot-nginx ; sudo certbot --nginx -d lostcube.pro
# Hub-ul stă la rădăcina domeniului: https://lostcube.pro/panel, /healthz, /releases/…, /hub/… .
# Sub un prefix: `location /prefixul-tău/ { proxy_pass http://127.0.0.1:34880/; }` — hub-ul acceptă și calea cu prefix.
server {
    listen 80;
    server_name lostcube.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lostcube.pro;

    ssl_certificate     /etc/letsencrypt/live/lostcube.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lostcube.pro/privkey.pem;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:34880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # POST /hub/claims/wait poate ține conexiunea deschisă până la 60 s
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
    }
}
